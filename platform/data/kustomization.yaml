apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data

resources:
  - storageclass.yaml 
  - postgres-pvc.yaml 
  - postgres-deployment.yaml 
  - postgres-service.yaml 
  - db-init-job.yml

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
  - name: authco-db-secret
    envs:
      - secrets/authco.env
  - name: restauco-db-secret
    envs: 
      - secrets/restauco.env
  - name: spaco-db-secret
    envs: 
      - secrets/spaco.env

configMapGenerator:
  - name: db-init-sql
    files:
      - sql/init-db.sql